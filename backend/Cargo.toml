[package]
name    = "hubstarr"
version = "0.4.3"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Servidor do Hubstarr: serve a página, guarda as stacks em SQLite, grava os arquivos gerados e sobe a stack"

[dependencies]
axum       = "0.7"
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time", "signal"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
clap       = { version = "4", features = ["derive"] }
rusqlite   = { version = "0.40", features = ["bundled"] }
# só para buscar a captura da paleta no theme.park; rustls para não depender do OpenSSL do sistema
reqwest    = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
strip = true
